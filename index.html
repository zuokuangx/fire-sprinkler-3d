<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#080b10" />
<meta name="description" content="消防水喷淋（湿式自动喷水灭火）系统三维可视化教学系统 — 纯前端 WebGL 实现，可交互拆解、剖切、工况推演与水力计算演示。" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>消防水喷淋系统 · 三维可视化教学系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%94%A5</text></svg>" />
<link rel="stylesheet" href="/v/styles.css" />
</head>
<body>
<div id="app" data-view="3d" data-device="desktop">

  <div id="scene-host" aria-label="三维场景">
    <canvas id="scene-canvas" touch-action="none"></canvas>
  </div>

  <div id="loading">
    <div class="loading-inner">
      <div class="loading-mark">
        <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(47,212,240,.25)" stroke-width="2"/>
          <path d="M32 10c8 9 12 14 12 21a12 12 0 0 1-24 0c0-7 4-12 12-21z" fill="none" stroke="#2fd4f0" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M32 22c3.5 4 5 6.5 5 9.5a5 5 0 0 1-10 0c0-3 1.5-5.5 5-9.5z" fill="#2fd4f0" opacity=".55"/>
        </svg>
      </div>
      <div class="loading-title">消防水喷淋系统 · 三维可视化教学系统</div>
      <div class="loading-sub">Automatic Sprinkler System · Interactive 3D Teaching</div>
      <div class="loading-track"><div id="loading-bar"></div></div>
      <div id="loading-text">正在初始化场景…</div>
    </div>
  </div>

  <header id="topbar">
    <div id="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26">
          <path d="M16 3c5 5.6 7.5 9 7.5 13a7.5 7.5 0 0 1-15 0c0-4 2.5-7.4 7.5-13z" fill="none" stroke="#2fd4f0" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="16" cy="16.5" r="3.2" fill="#2fd4f0" opacity=".6"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>消防水喷淋系统</h1>
        <p id="brand-sub">湿式自动喷水灭火系统 · 三维教学可视化</p>
      </div>
    </div>

    <nav id="level-switch" aria-label="楼层选择"></nav>

    <div id="view-switch" role="group" aria-label="视角切换">
      <button type="button" data-view="iso" title="轴测视图 (1)"><span>轴测</span></button>
      <button type="button" data-view="front" title="正立面 (2)"><span>正立面</span></button>
      <button type="button" data-view="top" title="俯视图 (3)"><span>俯视</span></button>
      <button type="button" data-view="section" title="剖视图 (4)"><span>剖视</span></button>
    </div>

    <div id="top-actions">
      <button type="button" id="btn-scenario" class="tbtn accent" title="工况演示 (S)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
        <span class="tbtn-label">工况演示</span>
      </button>
      <button type="button" id="btn-tour" class="tbtn" title="教学导览 (T)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9.3l-4 4 1 5.7-5-2.7-5 2.7 1-5.7-4-4 5.5-.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span class="tbtn-label">教学导览</span>
      </button>
      <button type="button" id="btn-help" class="tbtn icon-only" title="帮助与快捷键 (H)" aria-label="帮助">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.7-.9 1.3v.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor"/></svg>
      </button>
      <button type="button" id="btn-fullscreen" class="tbtn icon-only only-desktop" title="全屏 (F)" aria-label="全屏">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" id="btn-shot" class="tbtn icon-only only-desktop" title="截图导出" aria-label="截图">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="6.5" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 6.5L10 4h4l1.5 2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
    </div>
  </header>

  <nav id="rail" aria-label="功能面板">
    <button type="button" data-tab="layers" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 12l9 5 9-5M3 16.5l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>图层</span>
    </button>
    <button type="button" data-tab="devices" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M12 3.5c3 3.4 4.5 5.6 4.5 8.2a4.5 4.5 0 0 1-9 0c0-2.6 1.5-4.8 4.5-8.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 20h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>设备</span>
    </button>
    <button type="button" data-tab="hydraulic" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 19V9M9.3 19V5M14.6 19v-6M20 19v-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M3 21h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>水力</span>
    </button>
    <button type="button" data-tab="learn" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 5.5A2 2 0 0 1 6 3.5h5v16H6a2 2 0 0 0-2 2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M20 5.5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>教学</span>
    </button>
    <button type="button" data-tab="settings" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5v2.2M12 18.3v2.2M4.9 7.6l1.9 1.1M17.2 15.3l1.9 1.1M4.9 16.4l1.9-1.1M17.2 8.7l1.9-1.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <aside id="panel" aria-label="信息面板">
    <div id="drawer-handle" aria-hidden="true"></div>
    <div class="panel-head">
      <h2 id="panel-title">图层管理</h2>
      <button type="button" id="panel-close" aria-label="关闭面板">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="panel-body"></div>
  </aside>

  <section id="hud-left" aria-label="图例">
    <div id="legend" class="glass">
      <div class="hud-title">图例</div>
      <ul id="legend-list"></ul>
    </div>
  </section>

  <section id="hud-right" aria-label="系统统计">
    <div id="stats" class="glass">
      <div id="fps" title="渲染帧率"><span class="dot"></span><b>--</b> FPS</div>
      <ul id="stats-list"></ul>
    </div>
    <div id="compass" class="glass" title="指北针">
      <svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true">
        <circle cx="22" cy="22" r="19" fill="none" stroke="rgba(120,165,200,.28)" stroke-width="1"/>
        <path d="M22 7l4 15-4-3-4 3z" fill="#2fd4f0" opacity=".9"/>
        <text x="22" y="40" text-anchor="middle" font-size="9" fill="#8b9aab">N</text>
      </svg>
    </div>
  </section>

  <div id="scenario-bar" aria-label="工况演示控制">
    <div class="sc-head">
      <span id="scenario-title">火情工况演示</span>
      <button type="button" id="scenario-close" aria-label="关闭工况条">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sc-track"><div id="scenario-progress"></div></div>
    <div id="scenario-controls">
      <div id="scenario-buttons"></div>
      <div class="sc-right">
        <span id="scenario-label">待开始</span>
        <div id="speed-group" role="group" aria-label="倍速">
          <button type="button" data-speed="0.5">0.5×</button>
          <button type="button" data-speed="1" class="on">1×</button>
          <button type="button" data-speed="2">2×</button>
          <button type="button" data-speed="4">4×</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tour-tip" role="dialog" aria-label="教学讲解">
    <div class="tt-head">
      <span id="tour-progress">1 / 12</span>
      <button type="button" id="tour-close" aria-label="退出导览">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <h3 id="tour-title">教学导览</h3>
    <p id="tour-text"></p>
    <div id="tour-controls">
      <button type="button" data-tour="prev">上一步</button>
      <button type="button" data-tour="next" class="primary">下一步</button>
    </div>
  </div>

  <div id="info-card" role="dialog" aria-label="设备信息">
    <div class="ic-head">
      <span id="info-card-kicker">设备详情</span>
      <button type="button" id="info-card-close" aria-label="关闭信息卡">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="info-card-body"></div>
  </div>

  <div id="help-modal" role="dialog" aria-modal="true" aria-label="帮助">
    <div class="hm-box">
      <div class="hm-head">
        <h2>操作指南</h2>
        <button type="button" id="help-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="hm-body" id="help-body"></div>
    </div>
  </div>

  <div id="schematic" aria-label="系统原理图">
    <canvas id="schematic-canvas"></canvas>
  </div>

  <div id="landscape-hint">
    <div class="lh-box">
      <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
        <rect x="18" y="8" width="28" height="48" rx="5" fill="none" stroke="#2fd4f0" stroke-width="2.5" transform="rotate(-12 32 32)"/>
      </svg>
      <p>横屏体验更佳</p>
      <button type="button" id="landscape-dismiss">我知道了</button>
    </div>
  </div>

  <div id="toast-wrap" aria-live="polite"></div>

  <div id="fatal-error" hidden>
    <div class="fe-box">
      <h2>场景初始化失败</h2>
      <p id="fatal-error-text"></p>
      <button type="button" onclick="location.reload()">重新加载</button>
    </div>
  </div>
</div>

<noscript>
  <div style="position:fixed;inset:0;display:grid;place-items:center;background:#080b10;color:#e6edf5;font-family:system-ui;text-align:center;padding:24px;z-index:9999">
    <div><h2>需要启用 JavaScript</h2><p>本系统为 WebGL 三维可视化应用，请启用 JavaScript 后重新打开。</p></div>
  </div>
</noscript>

<script type="module" src="/v/boot.js"></script>
</body>
</html>
